<!doctype html>
<html lang="{{ site.locale | replace: '_', '-' | default: 'en' }}">
  <head>
    {%- include head.html -%}
  </head>

  <body class="layout--{{ page.layout | default: 'page' }}">
    <a class="skip-link" href="#main">Skip to content</a>

    {%- include nav.html -%}

    <main class="page" id="main">
      {{ content }}
    </main>

    {%- include footer.html -%}

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>

    {%- if page.use_mermaid -%}
      <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
        mermaid.initialize({
          startOnLoad: true,
          theme: "base",
          themeVariables: {
            background:        "#101318",
            primaryColor:      "#151a21",
            primaryTextColor:  "#e6e9ee",
            primaryBorderColor:"#323b47",
            lineColor:         "#5eead4",
            secondaryColor:    "#1b212a",
            tertiaryColor:     "#101318",
            fontFamily:        "'JetBrains Mono', ui-monospace, monospace"
          }
        });
      </script>
    {%- endif -%}

    <!-- 100% privacy-first analytics -->
    <script data-collect-dnt="true" async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
